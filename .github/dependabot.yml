version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      k8s-io:
        patterns:
          - "k8s.io/*"
      sigs-k8s-io:
        patterns:
          - "sigs.k8s.io/*"
