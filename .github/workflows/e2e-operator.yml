name: "e2e - operator"

on:
  workflow_call:

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Set up Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true
      - name: "Publish Image"
        id: "publish"
        run: |
          export UUID=$(uuidgen | tr "[:upper:]" "[:lower:]")
          export CONTAINER_IMAGE="ttl.sh/${UUID}-${GITHUB_RUN_ID}-${GITHUB_RUN_NUMBER}:1h"
          
          echo ${CONTAINER_IMAGE}
          echo "image=${CONTAINER_IMAGE}" >> "$GITHUB_OUTPUT"
          
          make docker/build docker/push
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Set matrix"
        id: set-matrix
        run: echo "matrix=$(cat .github/e2e-matrix.json | jq -c)" >> "$GITHUB_OUTPUT"
  e2e-operator:
    runs-on: ubuntu-latest
    needs:
      - images
      - matrix
    env:
      CONTAINER_IMAGE: ${{needs.images.outputs.image}}
    strategy:
      matrix: ${{ fromJSON(needs.matrix.outputs.versions) }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "SetUp Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true
      - name: 'SetUp Kubectl'
        uses: azure/setup-kubectl@v5
        with:
          version: v${{ matrix.kubernetes-version }}
      - name: 'SetUp KinD'
        env:
          KIND_IMAGE_VERSION: v${{ matrix.kubernetes-version }}
        run: |
          make test/e2e/kind/setup
      - name: 'SetUp Kind Ingress'
        run: |
          make deploy/e2e/ingress
      - name: "SetUp Dapr Kubernetes Operator"
        run: |
          make deploy/e2e/controller
      - name: "Publish Dapr test Application"
        run: |
          make test/e2e/app
      - name: "Run Dapr Kubernetes Operator e2e"
        run: |
          make test/e2e/operator
